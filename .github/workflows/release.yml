name: Publish to npm

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC for npm trusted publishing. The npm CLI prefers the OIDC environment
      # over a configured token, so once this repository is registered as the
      # package's trusted publisher, no long-lived credential is involved.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing and staged publishing need npm >= 11.5.1, and
      # `npm trust` needs >= 11.15.0; the runner's bundled npm can be older.
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm test
      - run: npm publish
        env:
          # Used only when no trusted publisher is configured. npm removed
          # classic and automation tokens in November 2025, so this must be a
          # granular access token with "Bypass two-factor authentication"
          # enabled and read-and-write publish access — the default (bypass off)
          # fails in CI with EOTP. Direct publish from bypass-2FA tokens is
          # scheduled for removal in January 2027.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
